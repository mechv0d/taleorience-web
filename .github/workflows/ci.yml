name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright vs real backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start backend from source (dev)
        run: |
          git clone --depth 1 --branch dev https://github.com/mechv0d/taleorience-backend.git backend
          docker compose -f backend/docker-compose.yml up --build -d

      - name: Wait for API readiness
        run: |
          attempts=0
          until curl -sf http://localhost:4000/api/v1/projects >/dev/null; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge 60 ]; then
              echo "API did not become ready"
              docker compose -f backend/docker-compose.yml logs --tail=100
              exit 1
            fi
            sleep 2
          done
          echo "API is ready"

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Teardown backend
        if: always()
        run: docker compose -f backend/docker-compose.yml down -v

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7